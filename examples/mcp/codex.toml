[mcp_servers.forwardedit]
command = "/absolute/path/to/forwardedit/.venv/bin/forwardedit-mcp"
args = ["--workspace", "/absolute/path/to/experiment"]
startup_timeout_sec = 60
tool_timeout_sec = 7200

[mcp_servers.forwardedit.env]
CUDA_VISIBLE_DEVICES = "0"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
